  @media (max-width:640px){

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================================
   圆明园 · 数字意象复原
   ========================================================================= */

/* ---------- 0. 工具 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(20261018);
const rr = (a,b)=>a+(b-a)*rng();
const ri = (a,b)=>Math.floor(rr(a,b+1));
const pick = arr => arr[Math.floor(rng()*arr.length)];

const C = {
  vermilion : 0x9c2b23,
  wallRed   : 0xa8402f,
  goldTile  : 0xd8a62f,
  goldTile2 : 0xe6c461,
  greenTile : 0x3c7a5c,
  blueTile  : 0x2f4f86,
  marble    : 0xe7e3d7,
  stone     : 0xb4aea1,
  stoneDark : 0x8d867a,
  ruinStone : 0xc8c2b4,
  wood      : 0x54301d,
  ink       : 0x2a2622,
  bronze    : 0x7d5c2c,
  grass     : 0x50693c,
  water     : 0x2c6c82
};

/* ---------- 1. 程序化贴图 ---------- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')];}
function tex(canvas,rx=1,ry=1){const t=new THREE.CanvasTexture(canvas);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;return t;}

function makeGrass(){
  const [c,x]=cv(256,256);
  x.fillStyle='#4d6a3a';x.fillRect(0,0,256,256);
  for(let i=0;i<6000;i++){
    const g=ri(0,3);
    x.fillStyle=['#5b7a41','#425c31','#6b8450','#3b5330'][g];
    x.globalAlpha=rr(.15,.5);
    x.fillRect(rr(0,256),rr(0,256),rr(1,3),rr(1,3));
  }
  x.globalAlpha=1;
  for(let i=0;i<220;i++){ // 石板小径质感
    x.fillStyle='rgba(150,146,130,.10)';x.beginPath();
    x.arc(rr(0,256),rr(0,256),rr(2,7),0,7);x.fill();
  }
  return tex(c,150,150);
}
function makeStone(base='#b4aea1',dark=true){
  const [c,x]=cv(256,256);
  x.fillStyle=base;x.fillRect(0,0,256,256);
  for(let i=0;i<9000;i++){
    x.fillStyle=rng()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.07)';
    x.fillRect(rr(0,256),rr(0,256),rr(1,2.6),rr(1,2.6));
  }
  if(dark){
    for(let i=0;i<26;i++){ // 裂痕/水渍
      x.strokeStyle='rgba(70,62,50,.16)';x.lineWidth=rr(.6,2.2);x.beginPath();
      let px=rr(0,256),py=rr(0,256);x.moveTo(px,py);
      for(let k=0;k<5;k++){px+=rr(-40,40);py+=rr(-40,40);x.lineTo(px,py);}
      x.stroke();
    }
    for(let i=0;i<14;i++){x.fillStyle='rgba(90,100,80,.09)';x.beginPath();x.arc(rr(0,256),rr(0,256),rr(8,26),0,7);x.fill();}
  }
  const t=tex(c,3,3); return t;
}
function makeTile(){ // 筒瓦
  const [c,x]=cv(128,128);
  x.fillStyle='#ffffff';x.fillRect(0,0,128,128);
  const n=8,w=128/n;
  for(let i=0;i<n;i++){
    const g=x.createLinearGradient(i*w,0,(i+1)*w,0);
    g.addColorStop(0,'#5c5c5c');g.addColorStop(.28,'#e8e8e8');
    g.addColorStop(.55,'#ffffff');g.addColorStop(.8,'#a8a8a8');g.addColorStop(1,'#4a4a4a');
    x.fillStyle=g;x.fillRect(i*w+.6,0,w-1.2,128);
  }
  x.globalAlpha=.35;
  for(let y=0;y<128;y+=16){x.fillStyle='#000';x.fillRect(0,y,128,1.4);}
  x.globalAlpha=1;
  return tex(c,10,3);
}
function makeLattice(){ // 窗棂（白=木格，黑=镂空）
  const [c,x]=cv(128,128);
  x.fillStyle='#000';x.fillRect(0,0,128,128);
  x.strokeStyle='#fff';x.lineWidth=4;
  for(let i=0;i<=4;i++){x.beginPath();x.moveTo(i*32,0);x.lineTo(i*32,128);x.stroke();}
  for(let i=0;i<=4;i++){x.beginPath();x.moveTo(0,i*32);x.lineTo(128,i*32);x.stroke();}
  x.strokeStyle='#fff';x.lineWidth=2.4;
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    const cx=i*32+16,cy=j*32+16,r=12;
    x.beginPath();
    x.moveTo(cx,cy-r);x.lineTo(cx+r,cy);x.lineTo(cx,cy+r);x.lineTo(cx-r,cy);x.closePath();x.stroke();
  }
  return tex(c,1,1);
}
function makeCaihua(){ // 和玺/旋子彩画意象
  const [c,x]=cv(512,96);
  x.fillStyle='#123c5e';x.fillRect(0,0,512,96);
  x.fillStyle='#c9a227';x.fillRect(0,0,512,7);x.fillRect(0,89,512,7);
  for(let i=0;i<8;i++){
    const cx=i*64+32, cy=48;
    x.strokeStyle='#2f8a6a';x.lineWidth=6;
    x.beginPath();x.arc(cx,cy,26,0,7);x.stroke();
    x.strokeStyle='#e0bd63';x.lineWidth=3.4;
    x.beginPath();x.arc(cx,cy,15,0,7);x.stroke();
    x.fillStyle='#a3322b';x.beginPath();x.arc(cx,cy,7,0,7);x.fill();
    x.strokeStyle='rgba(224,189,99,.75)';x.lineWidth=2.6;
    for(let k=0;k<6;k++){
      const a=k/6*Math.PI*2;
      x.beginPath();x.moveTo(cx+Math.cos(a)*26,cy+Math.sin(a)*26);
      x.quadraticCurveTo(cx+Math.cos(a+.4)*36,cy+Math.sin(a+.4)*36,cx+Math.cos(a+.9)*30,cy+Math.sin(a+.9)*30);
      x.stroke();
    }
  }
  return tex(c,1,1);
}
function makePlaque(text){
  const [c,x]=cv(512,160);
  const g=x.createLinearGradient(0,0,0,160);
  g.addColorStop(0,'#1d2b46');g.addColorStop(.5,'#0f1a2e');g.addColorStop(1,'#1d2b46');
  x.fillStyle=g;x.fillRect(0,0,512,160);
  x.strokeStyle='#c9a227';x.lineWidth=9;x.strokeRect(9,9,494,142);
  x.strokeStyle='rgba(201,162,39,.5)';x.lineWidth=2;x.strokeRect(22,22,468,116);
  x.fillStyle='#f0d98f';
  x.font='700 76px "STKaiti","KaiTi","Songti SC",serif';
  x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='rgba(240,217,143,.55)';x.shadowBlur=16;
  const step=Math.min(104,(430)/text.length);
  let start=256-(text.length-1)*step/2;
  for(let i=0;i<text.length;i++) x.fillText(text[i],start+i*step,84);
  x.shadowBlur=0;
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeWaterNormal(size=256){
  const [c,x]=cv(size,size);
  const H=(u,v)=>{
    let s=0;
    s+=Math.sin(u*Math.PI*2*3+Math.cos(v*Math.PI*2*2)*1.6)*.5;
    s+=Math.sin(v*Math.PI*2*5+Math.sin(u*Math.PI*2*3)*1.3)*.34;
    s+=Math.sin((u+v)*Math.PI*2*7)*.2;
    s+=Math.sin((u-v)*Math.PI*2*11)*.1;
    return s;
  };
  const img=x.createImageData(size,size);
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const u=i/size,v=j/size,e=1/size;
    const dx=(H(u+e,v)-H(u-e,v)), dy=(H(u,v+e)-H(u,v-e));
    let nx=-dx*2.2, ny=-dy*2.2, nz=1;
    const l=Math.hypot(nx,ny,nz);
    const o=(j*size+i)*4;
    img.data[o]=((nx/l)*.5+.5)*255;
    img.data[o+1]=((ny/l)*.5+.5)*255;
    img.data[o+2]=((nz/l)*.5+.5)*255;
    img.data[o+3]=255;
  }
  x.putImageData(img,0,0);
  return tex(c,14,14);
}
function makeGlow(){
  const [c,x]=cv(128,128);
  const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,244,214,1)');g.addColorStop(.25,'rgba(255,214,130,.55)');
  g.addColorStop(.6,'rgba(255,170,80,.14)');g.addColorStop(1,'rgba(255,150,60,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeLotus(){
  const [c,x]=cv(128,128);
  x.clearRect(0,0,128,128);
  x.fillStyle='#f0a9bf';
  for(let i=0;i<7;i++){
    const a=i/7*Math.PI*2;
    x.save();x.translate(64,64);x.rotate(a);
    x.beginPath();x.ellipse(0,-30,13,32,0,0,7);x.fill();
    x.restore();
  }
  x.fillStyle='#fbe6a2';x.beginPath();x.arc(64,64,12,0,7);x.fill();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makePad(){
  const [c,x]=cv(128,128);
  x.clearRect(0,0,128,128);
  const g=x.createRadialGradient(64,64,8,64,64,62);
  g.addColorStop(0,'#5e8f52');g.addColorStop(1,'#3f6b3c');
  x.fillStyle=g;x.beginPath();x.arc(64,64,58,0,7);x.fill();
  x.strokeStyle='rgba(20,45,20,.35)';x.lineWidth=1.6;
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;x.beginPath();x.moveTo(64,64);x.lineTo(64+Math.cos(a)*57,64+Math.sin(a)*57);x.stroke();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

const TEX = {};
function buildTextures(){
  TEX.grass   = makeGrass();
  TEX.stone   = makeStone('#b4aea1',true);
  TEX.ruin    = makeStone('#c6c0b2',true);
  TEX.tile    = makeTile();
  TEX.lattice = makeLattice();
  TEX.caihua  = makeCaihua();
  TEX.waterN  = makeWaterNormal();
  TEX.glow    = makeGlow();
  TEX.lotus   = makeLotus();
  TEX.pad     = makePad();
  sunGlow.material.map=TEX.glow;sunGlow.material.needsUpdate=true;
  moonGlow.material.map=TEX.glow;moonGlow.material.needsUpdate=true;
}

/* ---------- 2. 材质 ---------- */
const M = {};
function buildMaterials(){
  M.ground = new THREE.MeshStandardMaterial({map:TEX.grass,roughness:.98,metalness:0});
  M.marble = new THREE.MeshStandardMaterial({color:C.marble,map:TEX.stone,roughness:.75,metalness:.02});
  M.stone  = new THREE.MeshStandardMaterial({color:C.stone,map:TEX.stone,roughness:.9,metalness:.02});
  M.ruin   = new THREE.MeshStandardMaterial({color:C.ruinStone,map:TEX.ruin,roughness:.92,metalness:.02});
  M.ruinD  = new THREE.MeshStandardMaterial({color:0x9d978a,map:TEX.ruin,roughness:.95,metalness:.02});
  M.gold   = new THREE.MeshStandardMaterial({color:C.goldTile,map:TEX.tile,roughness:.42,metalness:.28,side:THREE.DoubleSide});
  M.gold2  = new THREE.MeshStandardMaterial({color:C.goldTile2,map:TEX.tile,roughness:.38,metalness:.32,side:THREE.DoubleSide});
  M.green  = new THREE.MeshStandardMaterial({color:C.greenTile,map:TEX.tile,roughness:.45,metalness:.25,side:THREE.DoubleSide});
  M.blue   = new THREE.MeshStandardMaterial({color:C.blueTile,map:TEX.tile,roughness:.45,metalness:.25,side:THREE.DoubleSide});
  M.grey   = new THREE.MeshStandardMaterial({color:0x5d6470,map:TEX.tile,roughness:.7,metalness:.1,side:THREE.DoubleSide});
  M.red    = new THREE.MeshStandardMaterial({color:C.vermilion,roughness:.62,metalness:.05});
  M.wall   = new THREE.MeshStandardMaterial({color:C.wallRed,roughness:.85,metalness:.02});
  M.wood   = new THREE.MeshStandardMaterial({color:C.wood,roughness:.75,metalness:.03});
  M.caihua = new THREE.MeshStandardMaterial({map:TEX.caihua,roughness:.6,metalness:.1});
  M.lattice= new THREE.MeshStandardMaterial({color:0x3a2015,alphaMap:TEX.lattice,transparent:true,alphaTest:.42,roughness:.8,side:THREE.DoubleSide});
  M.paper  = new THREE.MeshStandardMaterial({color:0xe6dcc2,roughness:.95,side:THREE.DoubleSide,transparent:true,opacity:.9});
  M.bronze = new THREE.MeshStandardMaterial({color:C.bronze,roughness:.45,metalness:.75});
  M.bronzeD= new THREE.MeshStandardMaterial({color:0x4e3a1c,roughness:.55,metalness:.7});
  M.water  = new THREE.MeshStandardMaterial({
    color:C.water,transparent:true,opacity:.86,roughness:.10,metalness:.55,

function buildGround(){
  const g=new THREE.PlaneGeometry(2600,2600,190,190);
  g.rotateX(-Math.PI/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i);
    const d=Math.hypot(x,z);
    let h=0;
    h+=Math.sin(x*0.012)*Math.cos(z*0.010)*4.2;
    h+=Math.sin(x*0.031+1.7)*Math.cos(z*0.027)*1.8;
    // 园区内压平
    const flat=THREE.MathUtils.smoothstep(d,250,520);
    // 挖福海（椭圆湖盆）
    const dn=Math.hypot((x-25)/92,(z+65)/68);
    const lake=(1-THREE.MathUtils.smoothstep(dn,0.55,1.00))*8.0;
    h=h*flat-lake;
    p.setY(i,h);
  }
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,M.ground);
  m.receiveShadow=true;m.position.y=-0.02;
  world.add(m);
}

function buildHills(){
  const g=new THREE.Group();
  // 近处丘阜（西北）
  const spots=[[-330,-260,95,26],[-260,-330,70,18],[330,-250,110,32],[430,120,120,26],[-420,120,130,30],[170,-330,80,20],[-150,-360,90,22]];
  for(const [x,z,r,h] of spots){
    const geo=new THREE.SphereGeometry(1,26,16);
    const p=geo.attributes.position;
    for(let i=0;i<p.count;i++){
      const px=p.getX(i),py=p.getY(i),pz=p.getZ(i);
      const n=1+Math.sin(px*5.1)*0.06+Math.cos(pz*4.3)*0.06+Math.sin(py*6.7)*0.04;
      p.setXYZ(i,px*n,py*n,pz*n);
    }
    geo.scale(r,h,r);geo.computeVertexNormals();
    const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x4a6338,roughness:1,flatShading:true}));
    m.position.set(x,-h*0.12,z);m.receiveShadow=true;
    g.add(m);
  }
  // 远山剪影
  const far=new THREE.Group();
  for(let i=0;i<26;i++){
    const a=i/26*Math.PI*2;
    const r=rr(760,1000);
    const h=rr(70,190),w=rr(110,240);
    const geo=new THREE.ConeGeometry(w,h,5,1);
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x6a86a0,fog:false,transparent:true,opacity:.55}));
    m.position.set(Math.cos(a)*r,h*0.32,Math.sin(a)*r);
    m.rotation.y=rng()*3;
    far.add(m);
  }
  const far2=far.clone();
  far2.children.forEach(m=>{m.material=m.material.clone();m.material.color.set(0x93a9bd);m.material.opacity=.42;m.scale.setScalar(1.25);m.position.y*=1.1;});
  g.add(far);g.add(far2);
  world.add(g);
}

const TMP = new THREE.Object3D();

function mesh(parent,geo,mat,x=0,y=0,z=0,ry=0){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);m.rotation.y=ry;
  m.castShadow=true;m.receiveShadow=true;
  if(parent)parent.add(m);
  return m;
}
function pushBox(list,w,h,d,x=0,y=0,z=0,ry=0){
  const g=new THREE.BoxGeometry(w,h,d);
  if(ry)g.rotateY(ry);
  g.translate(x,y,z);list.push(g);return g;
}
function mergeTo(parent,list,mat,shadow=true){
  if(!list.length)return null;
  const g=mergeGeometries(list,false);
  g.computeBoundingSphere();
  const m=new THREE.Mesh(g,mat);
  m.castShadow=shadow;m.receiveShadow=true;
  if(parent)parent.add(m);
  return m;
}
function colorGeo(geo,hex){
  const c=new THREE.Color(hex);
  const n=geo.attributes.position.count,arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
  geo.setAttribute('color',new THREE.BufferAttribute(arr,3));
  return geo;
}
function tGeo(geo,x,y,z,rx=0,ry=0,rz=0){
  if(rx)geo.rotateX(rx); if(ry)geo.rotateY(ry); if(rz)geo.rotateZ(rz);
  geo.translate(x,y,z);return geo;
}

/* ---------- 屋顶曲面（举折 + 起翘出翘） ---------- */
function roofSurface(w,d,h,o={}){
  const ridgeLen=w*(o.ridgeRatio??0.42);
  const flare=(o.flare??0.5), cp=o.curvePow??1.62;
  const rings=o.rings??16, seg=o.seg??64;
  const pos=[],uv=[],idx=[],corner=[];
  for(let r=0;r<=rings;r++){
    const t=r/rings;
    const a=THREE.MathUtils.lerp(w/2,ridgeLen/2,t);
    const b=Math.max(THREE.MathUtils.lerp(d/2,d*0.02,t),0.03);
    const y=h*Math.pow(t,cp);
    const ef=Math.pow(1-t,1.35);
    const liftC=flare*ef*Math.min(w,d)*0.32;
    const outC=1+0.17*ef;
    corner.push(new THREE.Vector3(a*outC,y+liftC,b*outC));
    for(let i=0;i<=seg;i++){
      const phi=i/seg*Math.PI*2;
      const c=Math.cos(phi),s=Math.sin(phi);
      const k=Math.min(a/Math.max(Math.abs(c),1e-6),b/Math.max(Math.abs(s),1e-6));
      let x=c*k,z=s*k;
      const nx=a>1e-4?x/a:0, nz=b>1e-4?z/b:0;
      const cf=Math.min(1,Math.abs(nx*nz));
      const lift=liftC*cf*cf;
      const out=1+0.17*ef*cf;
      pos.push(x*out,y+lift,z*out);
      uv.push(i/seg,t);
    }
  }
  for(let r=0;r<rings;r++)for(let i=0;i<seg;i++){
    const A=r*(seg+1)+i,B=A+1,C=A+seg+1,D=C+1;
    idx.push(A,C,B,B,C,D);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  return {geo:g,corner};
}

function tileMat(n){
  return {gold:M.gold,gold2:M.gold2,green:M.green,blue:M.blue,grey:M.grey}[n]||M.gold;
}

/* 完整中式屋顶（屋面 + 垂脊 + 正脊 + 吻兽 + 宝顶） */
function chineseRoof(parent,o={}){
  const w=o.w??24,d=o.d??14,h=o.h??8;
  const tile=o.tile??'gold';
  const mat=tileMat(tile);
  const ridgeRatio=o.ridgeRatio??0.42;
  const g=new THREE.Group();
  const {geo,corner}=roofSurface(w,d,h,{ridgeRatio,flare:o.flare??0.5,curvePow:o.curvePow??1.62,rings:o.rings??15,seg:o.seg??56});
  const surf=new THREE.Mesh(geo,mat);
  surf.castShadow=true;surf.receiveShadow=true;g.add(surf);

  const ridgeLen=w*ridgeRatio;
  const rr_=Math.max(0.35,Math.min(w,d)*0.045);
  // 垂脊 / 戗脊
  const cornList=[];
  for(const sx of [1,-1])for(const sz of [1,-1]){
    const pts=corner.map(p=>new THREE.Vector3(p.x*sx,p.y,p.z*sz));
    const curve=new THREE.CatmullRomCurve3(pts);
    const tg=new THREE.TubeGeometry(curve,22,rr_,6,false);
    cornList.push(tg);
  }
  mergeTo(g,cornList,mat);
  // 正脊
  const rb=[];
  pushBox(rb,ridgeLen+rr_*3,rr_*2.1,rr_*1.5,0,h+rr_*0.7,0);
  mergeTo(g,rb,mat);
  // 鸱吻 / 垂兽
  const orna=[];
  for(const sx of [1,-1]){
    const g1=new THREE.ConeGeometry(rr_*1.5,rr_*4.5,5);tGeo(g1,sx*(ridgeLen/2+rr_*1.4),h+rr_*2.6,0,0,0,-sx*0.42);orna.push(g1);
    const g2=new THREE.SphereGeometry(rr_*1.05,8,6);tGeo(g2,sx*(ridgeLen/2+rr_*1.8),h+rr_*1.2,0);orna.push(g2);
  }
  for(const sx of [1,-1])for(const sz of [1,-1]){
    const s=new THREE.SphereGeometry(rr_*0.95,7,6);
    tGeo(s,sx*(w/2*0.97),corner[0].y*0.98,sz*(d/2*0.97));orna.push(s);
  }
  mergeTo(g,orna,mat);
  // 宝顶（攒尖）
  if(o.finial){
    const f=[];
    const b=new THREE.CylinderGeometry(rr_*1.6,rr_*2.2,rr_*1.6,10);tGeo(b,0,h+rr_*0.6,0);f.push(b);
    const s=new THREE.SphereGeometry(rr_*2.3,12,10);tGeo(s,0,h+rr_*3.2,0);f.push(s);
    const t=new THREE.ConeGeometry(rr_*1.1,rr_*3.4,8);tGeo(t,0,h+rr_*5.6,0);f.push(t);
    const gold=new THREE.MeshStandardMaterial({color:0xf0cf6a,roughness:.28,metalness:.85});
    mergeTo(g,f,gold);
  }
  if(parent)parent.add(g);
  return g;
}

/* ---------- 须弥座台基 + 栏板望柱 ---------- */
function balustrade(parent,w,d,y,h,o={}){
  const list=[],post=o.post??0.42;
  const gap=o.gap??2.3;
  const nx=Math.max(2,Math.round(w/gap)), nz=Math.max(2,Math.round(d/gap));
  const put=(x,z)=>{
    pushBox(list,post*2,h*1.5,post*2,x,z===0?0:z,0);
    pushBox(list,post*3.0,h*0.42,post*3.0,x,y+h*1.5,z);
    const cap=new THREE.SphereGeometry(post*1.5,7,5);tGeo(cap,x,y+h*1.5+h*0.42+post*0.7,z);list.push(cap);
  };
  const rail=(x1,z1,x2,z2)=>{
    const len=Math.hypot(x2-x1,z2-z1);
    const g=new THREE.BoxGeometry(len,h*0.52,0.34);
    g.rotateY(-Math.atan2(z2-z1,x2-x1));
    g.translate((x1+x2)/2,y+h*0.62,(z1+z2)/2);
    list.push(g);
  };
  for(let i=0;i<=nx;i++){const x=-w/2+w*i/nx; put(x,d/2); put(x,-d/2);}
  for(let i=1;i<nz;i++){const z=-d/2+d*i/nz; put(w/2,z); put(-w/2,z);}
  for(let i=0;i<nx;i++){
    const x1=-w/2+w*i/nx,x2=-w/2+w*(i+1)/nx;
    rail(x1,d/2,x2,d/2); rail(x1,-d/2,x2,-d/2);
  }
  for(let i=0;i<nz;i++){
    const z1=-d/2+d*i/nz,z2=-d/2+d*(i+1)/nz;
    rail(w/2,z1,w/2,z2); rail(-w/2,z1,-w/2,z2);
  }
  // 地栿
  pushBox(list,w,h*0.34,d+0.1,0,y+h*0.17,0);
  return mergeTo(parent,list,M.marble);
}

function platform(parent,w,d,h,o={}){
  const g=new THREE.Group();
  const list=[];
  pushBox(list,w+3.4,h*0.35,d+3.4,0,h*0.175,0);          // 底
  pushBox(list,w+2.6,h*0.30,d+2.6,0,h*0.48,0);           // 束腰（略收）
  const band=[];
  pushBox(band,w+2.7,h*0.12,d+2.7,0,h*0.52,0);
  mergeTo(g,band,M.stone);
  pushBox(list,w+3.0,h*0.42,d+3.0,0,h*0.83,0);           // 上枋
  mergeTo(g,list,M.marble);
  // 台面石
  const top=new THREE.Mesh(new THREE.BoxGeometry(w+2.0,0.16,d+2.0),M.marble);
  top.position.y=h+0.02;top.receiveShadow=true;top.castShadow=true;g.add(top);
  if(o.rail!==false) balustrade(g,w+2.2,d+2.2,h,0.95,{gap:o.gap??2.4});
  // 踏道 + 御路
  if(o.steps!==false){
    const sw=Math.min(w*0.42,9),n=o.stepN??5;
    const st=[];
    for(let i=0;i<n;i++){
      const t=i/n;
      pushBox(st,sw,h/n,(d+3.4)/2 + 0.55 - t*0.55,0,h-h*t*0.5-h/(2*n),d/2+2.4+t*0.55);
    }
    mergeTo(g,st,M.marble);
    const ramp=new THREE.Mesh(new THREE.BoxGeometry(sw*0.34,0.22,Math.hypot(h, (d+3.4)/2-0.6)),M.marble);
    ramp.rotation.x=-Math.atan2(h,(d+3.4)/2-0.6);
    ramp.position.set(0,h*0.52,d/2+2.4+((d+3.4)/2-0.6)/2);
    ramp.receiveShadow=true;g.add(ramp);
  }
  if(parent)parent.add(g);
  return g;
}

/* ---------- 柱子 / 斗拱 / 门窗 ---------- */
function columnRow(list,w,d,colH,nBays,y0,r=0.42){
  const xs=[];
  for(let i=0;i<=nBays;i++) xs.push(-w/2+w*i/nBays);
  for(const x of xs)for(const z of [d/2-0.2,-d/2+0.2]){
    const base=new THREE.CylinderGeometry(r*1.45,r*1.6,0.34,10);tGeo(base,x,y0+0.17,z);list.base.push(base);
    const col=new THREE.CylinderGeometry(r*0.92,r,colH,12,1);tGeo(col,x,y0+0.34+colH/2,z);list.col.push(col);
    const cap=new THREE.CylinderGeometry(r*1.25,r*1.1,0.3,10);tGeo(cap,x,y0+0.34+colH+0.15,z);list.cap.push(cap);
  }
  return xs;
}

function dougong(parent,w,d,y,mat){
  const list=[];
  const gap=1.35;
  const nx=Math.max(2,Math.round(w/gap)),nz=Math.max(2,Math.round(d/gap));
  const put=(x,z)=>{
    pushBox(list,1.0,0.34,1.0,x,y,z);
    pushBox(list,0.72,0.30,0.72,x,y+0.32,z);
    pushBox(list,1.25,0.22,0.5,x,y+0.58,z);
  };
  for(let i=0;i<=nx;i++){const x=-w/2+w*i/nx;put(x,d/2);put(x,-d/2);}
  for(let i=1;i<nz;i++){const z=-d/2+d*i/nz;put(w/2,z);put(-w/2,z);}
  return mergeTo(parent,list,mat||M.caihua,false);
}

/* ---------- 中式殿堂 ---------- */
/*
 o: {w,d,bays,colH,plat,roofH,roofH2,eaves:1|2,tile,name,info,doors:true,color}
*/
function chineseHall(parent,o={}){
  const w=o.w??30,d=o.d??16,bays=o.bays??7;
  const colH=o.colH??7.4, plat=o.plat??2.3, roofH=o.roofH??7.5;
  const g=new THREE.Group();
  const y0=plat; // 柱脚标高

  platform(g,w,d,plat,{steps:o.steps!==false,gap:2.4});

  const L={base:[],col:[],cap:[]};
  const xs=columnRow(L,w,d,colH,bays,y0,Math.max(0.36,w*0.016));
  mergeTo(g,L.base,M.marble);
  mergeTo(g,L.col,o.color?new THREE.MeshStandardMaterial({color:o.color,roughness:.6}):M.red);
  mergeTo(g,L.cap,M.caihua);

  // 墙体
  const wl=[];
  pushBox(wl,w-0.5,colH*0.98,0.5,0,y0+colH*0.49,-d/2+0.5);
  pushBox(wl,0.5,colH*0.98,d-1.4,w/2-0.4,y0+colH*0.49,0);
  pushBox(wl,0.5,colH*0.98,d-1.4,-w/2+0.4,y0+colH*0.49,0);
  mergeTo(g,wl,M.wall);

  if(o.doors!==false){
    const dh=colH*0.62, dw=(w/bays)*0.82;
    for(let i=0;i<bays;i++){
      const x=-w/2+w*(i+0.5)/bays;

function archPath(cx,cy,hw,sh){
  const p=new THREE.Path();
  p.moveTo(cx-hw,cy);p.lineTo(cx-hw,cy+sh);
  p.absarc(cx,cy+sh,hw,Math.PI,0,true);
  p.lineTo(cx+hw,cy);p.closePath();
  return p;
}

/* ---------- 石拱桥 ---------- */
function stoneBridge(parent,o={}){
  const span=o.span??26,width=o.width??8;
  const crown=o.crown??(o.rise??span*0.26);
  const endY=1.3;
  const hw=span*0.205, spring=0.8;
  const sh=Math.max(0.4,crown-hw-2.2);
  const deckAt=t=>endY+(crown-endY)*Math.pow(Math.sin(Math.PI*Math.min(1,Math.max(0,t))),0.72);
  const g=new THREE.Group();
  const s=new THREE.Shape();
  s.moveTo(-span/2-3.0,-2.6);
  s.lineTo(-span/2-3.0,endY);
  const NS=22;
  for(let i=0;i<=NS;i++){
    const t=i/NS,x=-span/2+span*t;
    s.lineTo(x,deckAt(t));
  }
  s.lineTo(span/2+3.0,endY);
  s.lineTo(span/2+3.0,-2.6);
  s.closePath();
  s.holes.push(archPath(0,spring,hw,sh));
  const geo=new THREE.ExtrudeGeometry(s,{depth:width,bevelEnabled:false,curveSegments:16});
  geo.translate(0,0,-width/2);
  const body=new THREE.Mesh(geo,M.stone);
  body.castShadow=true;body.receiveShadow=true;g.add(body);
  // 券脸 + 栏板
  const list=[];
  for(const sz of [1,-1]){
    for(let i=0;i<=14;i++){
      const a=Math.PI-i/14*Math.PI;
      const k=new THREE.BoxGeometry(0.55,0.4,width+0.7);
      k.translate(Math.cos(a)*(hw+0.35),spring+sh+Math.sin(a)*(hw+0.35),0);
      list.push(k);
    }
  }
  const deckY=x=>deckAt((x+span/2)/span);
  const n=Math.max(4,Math.round(span/2.1));
  for(const sz of [1,-1]){
    for(let i=0;i<=n;i++){
      const x=-span/2+span*i/n, y=deckY(x);
      pushBox(list,0.4,1.25,0.4,x,y+0.62,sz*(width/2-0.3));
      const cap=new THREE.SphereGeometry(0.24,7,5);tGeo(cap,x,y+1.32,sz*(width/2-0.3));list.push(cap);
    }
    for(let i=0;i<n;i++){
      const x1=-span/2+span*i/n,x2=-span/2+span*(i+1)/n;
      const len=Math.hypot(x2-x1,deckY(x2)-deckY(x1));
      const r=new THREE.BoxGeometry(len,0.42,0.28);
      r.rotateZ(Math.atan2(deckY(x2)-deckY(x1),x2-x1));
      r.translate((x1+x2)/2,(deckY(x1)+deckY(x2))/2+0.75,sz*(width/2-0.3));
      list.push(r);
    }
  }
  mergeTo(g,list,M.marble);
  if(parent)parent.add(g);
  return g;
}

/* ---------- 植物 / 山石 ---------- */
function willowGeo(seed){
  const r=mulberry32(seed);const R=(a,b)=>a+(b-a)*r();
  const parts=[];
  const H=R(7,10), tr=R(0.28,0.46);
  let g=new THREE.CylinderGeometry(tr*0.5,tr,H,7,3);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ // 微弯
    const y=p.getY(i);const k=(y+H/2)/H;
    p.setX(i,p.getX(i)+Math.sin(k*2.2)*0.5);
  }
  tGeo(g,0,H/2,0,0,0,R(-0.05,0.05));
  parts.push(colorGeo(g,0x5b3f28));
  for(let i=0;i<5;i++){
    const a=i/5*7+ R(0,1), l=R(2.4,4.2);
    g=new THREE.CylinderGeometry(0.09,0.2,l,6,1);
    tGeo(g,0,H-0.6,0,R(-0.5,0.5),a,Math.PI/2-0.65);
    g.translate(0.2,H-0.9,0);
    parts.push(colorGeo(g,0x62452c));
  }
  const cy=H+R(0.6,1.8);
  for(let i=0;i<6;i++){
    const a=i/6*7,rr2=R(1.9,3.3);
    g=new THREE.SphereGeometry(1,7,5);
    g.scale(R(1.6,2.7),R(1.0,1.5),R(1.6,2.7));
    tGeo(g,Math.cos(a)*rr2,cy+R(-0.9,0.9),Math.sin(a)*rr2);
    parts.push(colorGeo(g,0x7fa348));
  }
  for(let i=0;i<18;i++){
    const a=i/18*Math.PI*2+R(-.2,.2), rr2=R(2.2,3.9);
    const l=R(2.2,4.4);
    g=new THREE.CylinderGeometry(0.035,0.13,l,5,1);
    tGeo(g,Math.cos(a)*rr2,cy-l/2-0.2,Math.sin(a)*rr2,R(-.14,.14),a,R(-.16,.16));
    parts.push(colorGeo(g,0x8cb352));
  }
  return mergeGeometries(parts,false);
}
function pineGeo(seed){

  const parts=[];const H=R(7,12);

function scatterVeg(geoList,count,test,opt={}){
  const insts=[];
  for(const g of geoList){
    const im=new THREE.InstancedMesh(g,M.leaf,count);
    im.castShadow=true;im.receiveShadow=true;
    let n=0;
    for(let i=0;i<count*14&&n<count;i++){
      const x=rr(opt.x0??-260,opt.x1??300);
      const z=rr(opt.z0??-230,opt.z1??200);
      if(test&&!test(x,z))continue;
      TMP.position.set(x,opt.y??0,z);
      TMP.rotation.set(rr(-.05,.05),rr(0,6.28),rr(-.05,.05));
      const s=rr(opt.s0??0.8,opt.s1??1.5);
      TMP.scale.set(s*rr(.9,1.1),s*rr(.85,1.2),s*rr(.9,1.1));
      TMP.updateMatrix();
      im.setMatrixAt(n++,TMP.matrix);
    }
    im.count=n;
    im.instanceMatrix.needsUpdate=true;
    world.add(im);
    insts.push(im);
  }
  return insts;
}
function rockGeo(r,seed){
  const rn=mulberry32(seed);
  const g=new THREE.IcosahedronGeometry(r,1);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const d=Math.hypot(x,y,z);
    const k=1+Math.sin(x*1.9+seed)*0.16+Math.cos(z*2.3)*0.14+Math.sin(y*2.7)*0.12+(rn()-0.5)*0.22;
    p.setXYZ(i,x*k/d*r*0.9,y*k*1.25,z*k/d*r*0.9);
  }
  g.computeVertexNormals();
  return g;
}
function scatterRocks(count,test,opt={}){
  const list=[];
  for(let i=0;i<count;i++){
    const x=rr(opt.x0??-260,opt.x1??300),z=rr(opt.z0??-230,opt.z1??200);
    if(test&&!test(x,z))continue;
    const s=rr(opt.s0??1.2,opt.s1??3.6);
    const g=rockGeo(s,i*97+3);
    g.rotateY(rr(0,6.28));g.translate(x,s*0.35,z);
    list.push(g);
  }
  return mergeTo(world,list,M.rock);
}

/* ---------- 水域 ---------- */
function waterBody(cx,cz,rx,rz,seed=1){
  const rn=mulberry32(seed);
  const shape=new THREE.Shape();
  const N=64;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const k=1+Math.sin(a*3+seed)*0.07+Math.sin(a*5+seed*2)*0.045+Math.cos(a*8)*0.02+(rn()-0.5)*0.03;
    const x=Math.cos(a)*rx*k, y=Math.sin(a)*rz*k;
    if(i===0)shape.moveTo(x,y);else shape.lineTo(x,y);
  }
  const geo=new THREE.ShapeGeometry(shape,32);
  geo.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(geo,M.water);
  m.position.set(cx,0.16,cz);
  m.receiveShadow=true;
  world.add(m);
  return m;
}

const LAKE={x:25,z:-65,rx:92,rz:68};
const dnLake=(x,z)=>Math.hypot((x-LAKE.x)/LAKE.rx,(z-LAKE.z)/LAKE.rz);
const EX=[];
const blockRect=(x0,x1,z0,z1)=>EX.push({t:'r',x0,x1,z0,z1});
const blockC=(x,z,r)=>EX.push({t:'c',x,z,r});
function blocked(x,z){
  for(const e of EX){
    if(e.t==='c'){if(Math.hypot(x-e.x,z-e.z)<e.r)return true;}
    else if(x>e.x0&&x<e.x1&&z>e.z0&&z<e.z1)return true;
  }
  return false;
}

/* 长廊 */
function corridor(parent,x1,z1,x2,z2,o={}){
  const len=Math.hypot(x2-x1,z2-z1);
  if(len<1)return null;
  const g=new THREE.Group();
  g.position.set((x1+x2)/2,0,(z1+z2)/2);
  g.rotation.y=Math.atan2(-(z2-z1),x2-x1);
  const D=o.d??4.6, colH=o.colH??3.5;
  const base=[];
  pushBox(base,len,0.55,D+1.6,0,0.27,0);
  mergeTo(g,base,M.marble,false);
  const L={base:[],col:[],cap:[]};
  const n=Math.max(2,Math.round(len/2.6));
  for(let i=0;i<=n;i++){
    const x=-len/2+len*i/n;
    for(const sz of [1,-1]){
      const b=new THREE.CylinderGeometry(0.3,0.34,0.24,8);tGeo(b,x,0.67,sz*(D/2));L.base.push(b);
      const c=new THREE.CylinderGeometry(0.24,0.28,colH,9,1);tGeo(c,x,0.67+colH/2,sz*(D/2));L.col.push(c);
    }
  }
  mergeTo(g,L.base,M.marble);
  mergeTo(g,L.col,M.red);
  const bl=[];
  for(const sz of [1,-1])pushBox(bl,len+0.6,0.42,0.42,0,0.67+colH+0.2,sz*(D/2));
  pushBox(bl,len+0.7,0.5,0.62,0,0.67+colH+0.7,0);
  mergeTo(g,bl,M.caihua,false);
  const rl=[];
  for(const sz of [1,-1])pushBox(rl,len-0.6,0.14,0.36,0,1.05,sz*(D/2-0.1));
  mergeTo(g,rl,M.red,false);
  chineseRoof(g,{w:len+2.2,d:D+2.4,h:o.roofH??2.3,ridgeRatio:0.93,flare:0.42,tile:o.tile??'gold',seg:44,rings:9}).position.y=0.67+colH+0.95;
  if(parent)parent.add(g);
  return g;
}

const M_JET = new THREE.MeshBasicMaterial({color:0xd6eef8,transparent:true,opacity:.40,depthWrite:false,fog:true});
const ZODIAC=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

function jaggedShape(w,h,holes,seed){
  const rn=mulberry32(seed);
  const s=new THREE.Shape();
  s.moveTo(-w/2,0);
  s.lineTo(-w/2,h*0.42);
  const n=16;
  for(let i=0;i<=n;i++){
    const x=-w/2+w*i/n;
    s.lineTo(x,h*(0.40+rn()*0.60));
  }
  s.lineTo(w/2,h*0.42);
  s.lineTo(w/2,0);
  s.closePath();
  for(const [cx,hw,sh] of holes) s.holes.push(archPath(cx,0,hw,sh));
  return s;
}
function dropGeo(geo,x,y,z,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){
  if(sx!==1||sy!==1||sz!==1)geo.scale(sx,sy,sz);
  if(rx)geo.rotateX(rx);if(ry)geo.rotateY(ry);if(rz)geo.rotateZ(rz);
  geo.translate(x,y,z);return geo;
}
function brokenCyl(rt,rb,h,seg,seed){
  const g=new THREE.CylinderGeometry(rt,rb,h,seg,3,false);
  const p=g.attributes.position;
  const drop=a=>h*0.07*(0.55+0.45*(Math.sin(a*3+seed)*0.5+Math.sin(a*7+seed*1.7)*0.3+Math.sin(a*13)*0.2));
  for(let i=0;i<p.count;i++){
    if(p.getY(i)>h/2-1e-3) p.setY(i,h/2-drop(Math.atan2(p.getZ(i),p.getX(i))));
  }
  g.computeVertexNormals();
  return g;
}

function westColumn(parent,x,y,z,r,h,o={}){

/* ---------- 海晏堂 + 十二生肖水力钟 ---------- */
function buildHaiyantang(parent,cx,cz){

  proj.position.set(0,1.6+(H+3)/2,D/2-1);proj.castShadow=true;proj.receiveShadow=true;G.add(proj);

  }
  facadeSlab(G,W,H+3,2.2,holes,M.ruinD).position.set(0,1.6,D/2+5.6);
  // 柱
  for(let i=0;i<8;i++){
    const x=-W/2+3.5+i*(W-7)/7;
    westColumn(G,x,1.6,D/2+8.2,0.95,H+2,i%3===2?{broken:true,seed:i*7}:{});
  }
  // 檐部（残缺）
  const ent=[];

  pushBox(ent,W*0.3,0.8,D*0.55,-W*0.34,1.6+H+3.4,-1);
  mergeTo(G,ent,M.ruin);
  pediment(G,26,6,10,1.6+H+4.0);
  // 残破的屋架
  const beam=[];

    wg.position.set(sx*(W/2+8),1.6+(H-5)/2,-1);wg.castShadow=true;G.add(wg);

  const pool=new THREE.Group();pool.position.set(0,0,D/2+22);G.add(pool);
  const rim=[];
  pushBox(rim,52,1.5,20,0,0.75,0);
  mergeTo(pool,rim,M.marble);
  const basin=new THREE.Mesh(new THREE.BoxGeometry(47,1.2,15),M.ruinD);
  basin.position.y=1.4;basin.receiveShadow=true;pool.add(basin);
  const wgeo=new THREE.PlaneGeometry(45.4,13.6);wgeo.rotateX(-Math.PI/2);
  const w=new THREE.Mesh(wgeo,M.water);w.position.y=1.98;pool.add(w);

  const p2=new THREE.CylinderGeometry(1.1,1.6,3.4,10);dropGeo(p2,0,2.7,0);mlist.push(p2);
  const p3=new THREE.SphereGeometry(1.5,12,10);dropGeo(p3,0,5.4,0,0,0,0,1,0.7,1);mlist.push(p3);
  mergeTo(mid,mlist,M.marble);

    const b2=new THREE.CylinderGeometry(0.62,0.82,1.5,10);dropGeo(b2,0,1.0,0);pl.push(b2);

}

/* ---------- 谐奇趣 ---------- */
function buildXieqiqu(parent,cx,cz){
  const G=new THREE.Group();G.position.set(cx,0,cz);parent.add(G);
  const W=44,D=22,H=14;
  const plat=[];
  pushBox(plat,W+8,1.8,D+8,0,0.9,0);
  mergeTo(G,plat,M.marble);
  const body=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),M.ruin);
  body.position.y=1.8+H/2;body.castShadow=true;G.add(body);
  const proj=new THREE.Mesh(new THREE.BoxGeometry(18,H+4,D*0.5),M.ruin);
  proj.position.set(0,1.8+(H+4)/2,D/2);proj.castShadow=true;G.add(proj);
  const holes=[];
  for(let i=0;i<5;i++){
    const x=-W/2+5+i*(W-10)/4;
    holes.push([x,3.2,1.6,4.4]);holes.push([x,10.4,1.4,3.2]);
  }
  facadeSlab(G,W,H,2.4,holes,M.ruinD).position.set(0,1.8,D/2+4.9);
  for(let i=0;i<6;i++){
    westColumn(G,-W/2+4+i*(W-8)/5,1.8,D/2+6.6,1.0,H+1,i===1?{broken:true,seed:i*5}:{});
  }
  entablature(G,W+2,D+16,1.8+H+1.2,{dentils:true});
  // 双穹顶（一半已坍）
  for(const sx of [1,-1]){
    const base=new THREE.Mesh(new THREE.CylinderGeometry(7.4,7.4,3.4,20),M.ruin);
    base.position.set(sx*15,1.8+H+3.0,-1);base.castShadow=true;G.add(base);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(7.2,22,14,0,sx>0?Math.PI*2:Math.PI*1.25,0,Math.PI/2),
      sx>0?M.ruinD:M.ruin);
    dome.position.set(sx*15,1.8+H+4.6,-1);dome.castShadow=true;G.add(dome);
    const lan=new THREE.Mesh(new THREE.CylinderGeometry(0.6,1.0,2.2,10),M.ruin);
    if(sx>0){lan.position.set(sx*15,1.8+H+12.4,-1);G.add(lan);}
  }
  // 海棠式喷水池
  const pool=new THREE.Group();pool.position.set(0,0,D/2+16);G.add(pool);
  const sh=new THREE.Shape();
  for(let i=0;i<=72;i++){
    const a=i/72*Math.PI*2;
    const k=13*(1+0.16*Math.cos(a*4));
    const x=Math.cos(a)*k, y=Math.sin(a)*k*0.72;
    if(i===0)sh.moveTo(x,y);else sh.lineTo(x,y);
  }
  const rimG=new THREE.ExtrudeGeometry(sh,{depth:1.4,bevelEnabled:false,curveSegments:6});
  rimG.rotateX(-Math.PI/2);
  const rim=new THREE.Mesh(rimG,M.marble);rim.position.y=1.4;rim.receiveShadow=true;pool.add(rim);
  const wg=new THREE.ShapeGeometry(sh,6);wg.rotateX(-Math.PI/2);
  const wat=new THREE.Mesh(wg,M.water);wat.position.y=1.25;pool.add(wat);
  const mid=new THREE.Group();mid.position.set(0,1.2,0);pool.add(mid);
  const ml=[];
  const c1=new THREE.CylinderGeometry(1.6,2.2,0.8,12);dropGeo(c1,0,0.4,0);ml.push(c1);
  const c2=new THREE.CylinderGeometry(0.7,1.0,3.2,10);dropGeo(c2,0,2.4,0);ml.push(c2);
  const c3=new THREE.SphereGeometry(1.1,12,10);dropGeo(c3,0,4.6,0,0,0,0,1,0.75,1);ml.push(c3);
  mergeTo(mid,ml,M.marble);
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    const j=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.34,3.2,8,1,true),M_JET);
    j.position.set(Math.cos(a)*2.4,5.2,Math.sin(a)*2.4);
    j.rotation.z=-Math.cos(a)*0.75;j.rotation.x=Math.sin(a)*0.75;
    mid.add(j);ANIM.jets.push(j);
  }
  rubble(G,0,D/2+26,24,30,31);
  return G;
}

/* ---------- 万花阵（黄花阵迷宫） ---------- */
function buildMaze(parent,cx,cz,N=9,cell=4.0){
  const G=new THREE.Group();G.position.set(cx,0,cz);parent.add(G);
  const V=[],H=[];
  for(let i=0;i<N-1;i++){const a=[];for(let j=0;j<N;j++)a.push(true);V.push(a);}
  for(let i=0;i<N;i++){const a=[];for(let j=0;j<N-1;j++)a.push(true);H.push(a);}
  const vis=[];for(let i=0;i<N;i++){const a=[];for(let j=0;j<N;j++)a.push(false);vis.push(a);}
  const stack=[[0,0]];vis[0][0]=true;
  while(stack.length){
    const [i,j]=stack[stack.length-1];
    const nb=[];
    if(i>0&&!vis[i-1][j])nb.push([i-1,j,'V',i-1,j]);
    if(i<N-1&&!vis[i+1][j])nb.push([i+1,j,'V',i,j]);
    if(j>0&&!vis[i][j-1])nb.push([i,j-1,'H',i,j-1]);
    if(j<N-1&&!vis[i][j+1])nb.push([i,j+1,'H',i,j]);
    if(!nb.length){stack.pop();continue;}
    const [ni,nj,t,wi,wj]=nb[Math.floor(rng()*nb.length)];
    if(t==='V')V[wi][wj]=false;else H[wi][wj]=false;
    vis[ni][nj]=true;stack.push([ni,nj]);
  }
  const c0=Math.floor(N/2)-1,c1=Math.floor(N/2)+1;
  for(let i=c0;i<=c1;i++)for(let j=c0;j<=c1;j++){
    if(i<N-1)V[i][j]=false; if(i>0)V[i-1][j]=false;
    if(j<N-1)H[i][j]=false; if(j>0)H[i][j-1]=false;
  }
  const list=[];
  const ox=-N/2*cell, oz=-N/2*cell;
  const hgt=2.4;
  for(let i=0;i<N-1;i++)for(let j=0;j<N;j++)if(V[i][j])
    pushBox(list,0.9,hgt,cell+0.9,ox+(i+1)*cell,hgt/2,oz+(j+0.5)*cell);
  for(let i=0;i<N;i++)for(let j=0;j<N-1;j++)if(H[i][j])
    pushBox(list,cell+0.9,hgt,0.9,ox+(i+0.5)*cell,hgt/2,oz+(j+1)*cell);
  for(let i=0;i<N;i++){
    pushBox(list,cell+0.9,hgt,0.9,ox+(i+0.5)*cell,hgt/2,oz);
    if(i===Math.floor(N/2))continue;
    pushBox(list,cell+0.9,hgt,0.9,ox+(i+0.5)*cell,hgt/2,oz+N*cell);
  }
  for(let j=0;j<N;j++){
    pushBox(list,0.9,hgt,cell+0.9,ox,hgt/2,oz+(j+0.5)*cell);
    pushBox(list,0.9,hgt,cell+0.9,ox+N*cell,hgt/2,oz+(j+0.5)*cell);
  }
  mergeTo(G,list,M.hedge);
  // 中央圆亭
  const pav=new THREE.Group();G.add(pav);
  const bl=[];
  const base=new THREE.CylinderGeometry(4.6,5.0,0.7,20);dropGeo(base,0,0.35,0);bl.push(base);
  for(let i=0;i<4;i++){const s=new THREE.BoxGeometry(6.2,0.4,1.6);dropGeo(s,0,0.85,i%2?0:0,0,i/4*Math.PI+Math.PI/4,0);bl.push(s);}
  mergeTo(pav,bl,M.marble);
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    westColumn(pav,Math.cos(a)*4.0,1.0,Math.sin(a)*4.0,0.42,5.4);
  }
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(4.7,4.7,0.6,20),M.ruin);
  ring.position.y=1.0+5.4+0.9;pav.add(ring);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(4.9,22,14,0,Math.PI*2,0,Math.PI/2),M.ruinD);
  dome.position.y=ring.position.y+0.3;dome.castShadow=true;pav.add(dome);
  const fin=new THREE.Mesh(new THREE.ConeGeometry(0.5,1.8,8),M.bronze);
  fin.position.y=dome.position.y+5.0;pav.add(fin);
  return G;
}

];
const _c1=new THREE.Color(),_c2=new THREE.Color(),_c3=new THREE.Color();
function lerpHex(target,a,b,k){target.setHex(a);_c2.setHex(b);target.lerp(_c2,k);}
let curTime=9.4, nightF=0, lanternOn=true, fogOn=true;
function setTime(t){
  t=((t%24)+24)%24;
  curTime=t;
  let i=0;while(i<KEY.length-2&&t>KEY[i+1].t)i++;
  const A=KEY[i],B=KEY[i+1];
  const k=THREE.MathUtils.clamp((t-A.t)/(B.t-A.t),0,1);
  lerpHex(skyUniforms.topColor.value,A.top,B.top,k);
  lerpHex(skyUniforms.midColor.value,A.mid,B.mid,k);
  lerpHex(skyUniforms.botColor.value,A.bot,B.bot,k);
  lerpHex(skyUniforms.sunColor.value,A.sun,B.sun,k);
  lerpHex(_c3,A.fog,B.fog,k);
  if(fogOn){scene.fog.color.copy(_c3);scene.fog.density=THREE.MathUtils.lerp(A.fd,B.fd,k);}
  sun.color.copy(skyUniforms.sunColor.value);
  sun.intensity=THREE.MathUtils.lerp(A.si,B.si,k);
  hemi.intensity=THREE.MathUtils.lerp(A.hi,B.hi,k)*0.55;
  amb.intensity=THREE.MathUtils.lerp(A.ai,B.ai,k)*0.5;
  hemi.color.copy(skyUniforms.midColor.value);

  const ang=(t-6)/12*Math.PI;
  const dir=new THREE.Vector3(Math.cos(ang),Math.sin(ang),0.42).normalize();
  const sunElev=Math.sin(ang);
  renderer.toneMappingExposure=THREE.MathUtils.lerp(0.92,1.14,THREE.MathUtils.smoothstep(sunElev,-0.10,0.45));
  sun.position.copy(dir).multiplyScalar(520);
  sun.target.position.set(0,0,-20);
  skyUniforms.sunDir.value.copy(dir);
  sunMesh.position.copy(dir).multiplyScalar(1500);
  moonMesh.position.copy(dir).multiplyScalar(-1350);
  const elev=Math.sin(ang);
  nightF=1-THREE.MathUtils.smoothstep(elev,-0.06,0.24);
  sunMesh.visible=elev>-0.12;
  moonMesh.visible=elev<0.05;
  starMat.opacity=Math.pow(nightF,1.6)*0.95;
  stars.visible=starMat.opacity>0.02;
  // 宫灯
  const li=nightF*(lanternOn?1:0);
  for(const L of lanterns){
    L.body.material.emissiveIntensity=li*2.6;
    L.halo.material.opacity=li*0.8;
  }
  for(let n=0;n<nightLights.length;n++) nightLights[n].intensity=li*260;
  // 时辰名
  const SHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const idx=Math.floor(((t+1)%24)/2);
  document.getElementById('tlabel').textContent=SHI[idx]+'时 '+String(Math.floor(t)).padStart(2,'0')+':'+String(Math.floor((t%1)*60)).padStart(2,'0');
  updateEnv();
}
/* 环境光照（由天穹生成） */
let pmrem=null,envRT=null,envScene=null,lastEnv=-99;
function initEnv(){
  try{
    pmrem=new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    envScene=new THREE.Scene();
    const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),sky.material.clone());
    m.material.uniforms=sky.material.uniforms;
    m.material.side=THREE.BackSide;
    m.material.depthWrite=false;
    envScene.add(m);
    envScene.add(new THREE.AmbientLight(0xffffff,0.6));
  }catch(e){console.warn('env skip',e);}
}
function updateEnv(){
  if(!pmrem||!envScene)return;
  if(Math.abs(curTime-lastEnv)<0.5)return;
  lastEnv=curTime;
  try{
    const rt=pmrem.fromScene(envScene,0.04,0.1,100);
    if(envRT)envRT.dispose();
    envRT=rt;
    scene.environment=rt.texture;
  }catch(e){}
}

/* ---------- 相机飞行 ---------- */
let fly=null;
function flyTo(p,t,dur=2000){
  fly={p0:camera.position.clone(),t0:controls.target.clone(),
       p1:new THREE.Vector3(p[0],p[1],p[2]),t1:new THREE.Vector3(t[0],t[1],t[2]),
       s:performance.now(),dur};
}

/* ---------- 拾取 ---------- */
const ray=new THREE.Raycaster();
const ptr=new THREE.Vector2();
const tip=document.getElementById('tip');
let downPos=null,lastPtr=null,hoverT=0;
function findInfo(obj){
  let o=obj;
  while(o){if(o.userData&&o.userData.info)return o.userData.info;o=o.parent;}
  return null;
}
function doPick(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();
  ptr.x=((cx-r.left)/r.width)*2-1;
  ptr.y=-((cy-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(pickables,true);
  for(const h of hits){
    if(h.object.isPoints||h.object.isSprite)continue;
    const info=findInfo(h.object);
    if(info)return info;
  }
  return null;
}
function showInfo(info){
  const box=document.getElementById('info');
  box.classList.remove('off');
  document.getElementById('iTitle').textContent=info.title;
  document.getElementById('iSub').textContent=info.sub;
  document.getElementById('iBody').textContent=info.body;
}
renderer.domElement.addEventListener('pointerdown',e=>{downPos=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos)return;
  const d=Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1]);
  downPos=null;
  if(d>6)return;
  const info=doPick(e.clientX,e.clientY);
  if(info)showInfo(info);
});
renderer.domElement.addEventListener('pointermove',e=>{
  tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';
  lastPtr={x:e.clientX,y:e.clientY};
});
document.getElementById('iClose').onclick=()=>document.getElementById('info').classList.add('off');

/* ---------- 界面 ---------- */
const viewsBox=document.getElementById('views');
VIEWS.forEach((v,i)=>{
  const b=document.createElement('button');
  b.className='btn';
  b.style.cssText='font-size:12px;padding:6px 4px;text-align:left;';
  b.textContent=(i+1)+'. '+v.n;
  b.onclick=()=>{
    [...viewsBox.children].forEach(c=>c.classList.remove('on'));
    b.classList.add('on');
    flyTo(v.p,v.t);
    autoTour=false;document.getElementById('bTour').classList.remove('on');
  };
  viewsBox.appendChild(b);
});
const timeEl=document.getElementById('time');
timeEl.oninput=()=>{setTime(parseFloat(timeEl.value));autoTime=false;document.getElementById('bAuto').classList.remove('on');};
let autoTime=false,autoTour=false,tourIdx=0,tourT=0;
document.getElementById('bAuto').onclick=e=>{
  autoTime=!autoTime;e.target.classList.toggle('on',autoTime);
  if(autoTime)timeEl.disabled=false;
};
document.getElementById('bTour').onclick=e=>{
  autoTour=!autoTour;e.target.classList.toggle('on',autoTour);
  if(autoTour){tourT=0;goTour();}
};
document.getElementById('bLantern').onclick=e=>{lanternOn=!lanternOn;e.target.classList.toggle('on',lanternOn);setTime(curTime);};
document.getElementById('bFog').onclick=e=>{
  fogOn=!fogOn;e.target.classList.toggle('on',fogOn);
  if(fogOn){scene.fog=new THREE.FogExp2(0xc4d7e2,0.0011);}else{scene.fog=null;}
  scene.traverse(o=>{
    if(o.material){
      const ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(m=>{m.needsUpdate=true;});
    }
  });
  setTime(curTime);
};
function goTour(){
  const v=VIEWS[tourIdx%VIEWS.length];
  flyTo(v.p,v.t,2600);
  const btns=[...viewsBox.children];
  btns.forEach(c=>c.classList.remove('on'));
  btns[tourIdx%VIEWS.length].classList.add('on');
  tourIdx++;
}

/* ---------- 主渲染 ---------- */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.06);
  const now=performance.now();
  const tt=now*0.001;

  if(fly){
    let k=(now-fly.s)/fly.dur;
    if(k>=1){k=1;}
    const e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e);
    controls.target.lerpVectors(fly.t0,fly.t1,e);
    if(k===1)fly=null;
  }
  if(autoTime){
    setTime(curTime+dt*0.42);
    timeEl.value=curTime;
  }
  if(autoTour){
    tourT+=dt;
    if(tourT>15){tourT=0;goTour();}
  }
  // 水
  TEX.waterN.offset.x=(tt*0.012)%1;
  TEX.waterN.offset.y=(tt*0.0075)%1;
  // 舟
  for(const b of ANIM.boats){
    b.position.y=0.3+Math.sin(tt*0.6)*0.13;
    b.rotation.z=Math.sin(tt*0.5)*0.022;
    b.rotation.x=Math.sin(tt*0.37+1)*0.016;
  }
  // 喷泉
  for(let i=0;i<ANIM.jets.length;i++){
    const j=ANIM.jets[i];
    const s=0.82+0.18*Math.sin(tt*2.6+i*0.7);
    j.scale.set(1,s,1);
  }
  // 悬停提示
  hoverT+=dt;
  if(hoverT>0.13){
    hoverT=0;
    if(lastPtr&&!downPos){
      const info=doPick(lastPtr.x,lastPtr.y);
      if(info){tip.textContent=info.title;tip.style.opacity='1';renderer.domElement.style.cursor='pointer';}
      else{tip.style.opacity='0';renderer.domElement.style.cursor='default';}
    }
  }
  controls.update();
  renderer.render(scene,camera);
}

/* ---------- 构建流程 ---------- */
const bar=document.getElementById('lbar'),ltext=document.getElementById('ltext');
const STEPS=[
  ['调制颜料、烧造琉璃…',()=>{buildTextures();}],
  ['备料：石材、楠木、汉白玉…',()=>{buildMaterials();}],
  ['相地：挖湖堆山…',()=>{buildGround();buildHills();}],
  ['植松柏、栽垂柳…',()=>{buildVeg();}],
  ['营建正大光明殿、九州清晏…',()=>{buildChineseGarden();}],
  ['引水入福海，筑蓬岛瑶台…',()=>{buildWestern();}],
  ['遍植花木、叠石理水…',()=>{buildNature();}],
  ['周缭园墙，落成…',()=>{
     buildWalls();
     initEnv();
     nightLights[0].position.set(0,12,110);
     nightLights[1].position.set(0,10,60);
     nightLights[2].position.set(150,10,-60);
     nightLights[3].position.set(150,12,-118);
     nightLights[4].position.set(25,8,-60);
     setTime(9.4);
   }]
];
let si=0;
function step(){
  if(si>=STEPS.length){
    bar.style.width='100%';
    camera.position.set(-60,320,350);
    controls.target.set(40,0,-40);
    setTimeout(()=>{
      document.getElementById('loader').classList.add('hide');
      showInfo(INFO.zhengda);
      // 开场：缓缓推入
      camera.position.set(-40,420,560);
      flyTo([-60,320,350],[40,0,-40],4200);
    },420);
    animate();
    return;
  }
  ltext.textContent=STEPS[si][0];
  bar.style.width=Math.round(si/STEPS.length*100)+'%';
  const fn=STEPS[si][1];
  si++;
  setTimeout(()=>{fn();step();},30);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
step();
